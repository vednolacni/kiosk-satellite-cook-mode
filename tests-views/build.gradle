// Runs the real Android views under Robolectric, with real drawing, and saves what they look like.
// Needs ANDROID_HOME for android.jar. .github/workflows/views.yml fetches the icons and the font first.
plugins {
    id 'java'
}

repositories {
    mavenCentral()
    google()
}

def androidJar = files("${System.getenv('ANDROID_HOME')}/platforms/android-35/android.jar")

sourceSets {
    main {
        java {
            srcDirs = ['../src', '../sdk/src']
        }
    }
}

dependencies {
    compileOnly androidJar
    testImplementation 'org.robolectric:robolectric:4.16.1'
    testImplementation 'junit:junit:4.13.2'
    // Robolectric brings the real classes. JUnit still reads @Config, which names Application, outside its sandbox.
    testImplementation androidJar
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

test {
    useJUnit()
    maxHeapSize = '3g'
    outputs.upToDateWhen { false }
    systemProperty 'screenshots', layout.buildDirectory.dir('screenshots').get().asFile.path
    systemProperty 'fixtures', layout.buildDirectory.dir('fixtures').get().asFile.path
    // Robolectric needs androidx.test, which comes as an AAR. A plain Java project only reads the classes inside.
    doFirst {
        def unpacked = layout.buildDirectory.dir('aars').get().asFile
        configurations.testRuntimeClasspath.files.findAll { it.name.endsWith('.aar') }.each { aar ->
            copy {
                from(zipTree(aar)) { include 'classes.jar' }
                into unpacked
                rename { aar.name.replace('.aar', '.jar') }
            }
        }
        classpath += files(fileTree(unpacked))
    }
    testLogging {
        events 'passed', 'failed', 'skipped'
        exceptionFormat 'full'
        showStandardStreams = true
    }
}
