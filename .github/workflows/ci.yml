name: Build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - name: Install Android build tools
        run: sdkmanager 'platforms;android-35' 'platforms;android-26' 'build-tools;35.0.0'
      # The manifest allows Android 8.0, and a call to anything newer would crash there, not fail here.
      - name: Compile against the oldest Android the manifest allows
        run: |
          mkdir -p "$RUNNER_TEMP/api26"
          javac --release 8 -encoding UTF-8 -cp "$ANDROID_HOME/platforms/android-26/android.jar" -d "$RUNNER_TEMP/api26" $(find sdk/src src -name '*.java')
      - name: Test
        run: python3 tools/test.py
      - name: Build
        run: python3 tools/build.py --android-platform 35
      # A development build to install with Plugin Manager > Developer Tools > Install from ZIP.
      - if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: cook-mode
          path: dist/*.zip
